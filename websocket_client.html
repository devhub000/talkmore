<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS & STT WebSocket Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 22px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        
        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        .btn-danger {
            background: #ff6b6b;
            color: white;
        }
        
        .btn-danger:hover {
            background: #ee5a52;
        }
        
        .output {
            background: #f8f9fa;
            border: 2px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
            color: #333;
            line-height: 1.5;
        }
        
        .output.error {
            background: #ffe0e0;
            border-color: #ff6b6b;
            color: #c92a2a;
        }
        
        .output.success {
            background: #e0ffe0;
            border-color: #51cf66;
            color: #2f7d32;
        }
        
        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .status.connected {
            background: #c3fad7;
            color: #1b7c2a;
        }
        
        .status.disconnected {
            background: #ffd0d0;
            color: #c92a2a;
        }
        
        .status.processing {
            background: #fff3c6;
            color: #9a6400;
        }
        
        .audio-player {
            width: 100%;
            margin-top: 15px;
        }
        
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Vietnamese TTS & STT WebSocket Demo</h1>
        
        <div class="grid">
            <!-- TTS Section -->
            <div class="card">
                <h2>Text-to-Speech (TTS)</h2>
                <div class="status disconnected" id="ttsStatus">Disconnected</div>
                
                <div class="form-group">
                    <label for="ttsText">Text to Synthesize:</label>
                    <textarea id="ttsText" placeholder="Nhập văn bản tiếng Việt...">Xin chào bạn</textarea>
                </div>
                
                <div class="form-group">
                    <label for="ttsVoice">Voice:</label>
                    <select id="ttsVoice">
                        <option value="banmai">Ban Mai (Female)</option>
                        <option value="chieuthanh">Chiều Thanh (Female)</option>
                        <option value="lacphi">Lạc Phi (Female)</option>
                        <option value="manhdung">Mạnh Dũng (Male)</option>
                        <option value="mattheo">Mattheo (Male)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="ttsSpeed">Speed: <span id="speedValue">1.5</span></label>
                    <input type="range" id="ttsSpeed" min="0.5" max="3" step="0.1" value="1.5">
                </div>
                
                <div class="button-group">
                    <button class="btn-primary" id="ttsSynthButton">Synthesize</button>
                    <button class="btn-danger" id="ttsDisconnectBtn">Disconnect</button>
                </div>
                
                <audio id="ttsAudio" controls class="audio-player" style="display:none;"></audio>
                
                <div class="output" id="ttsOutput"></div>
            </div>
            
            <!-- STT Section -->
            <div class="card">
                <h2>Speech-to-Text (STT)</h2>
                <div class="status disconnected" id="sttStatus">Disconnected</div>
                
                <div class="form-group">
                    <label for="sttFile">Upload Audio File:</label>
                    <input type="file" id="sttFile" accept="audio/*">
                </div>
                
                <div class="form-group">
                    <label for="sttSampleRate">Sample Rate:</label>
                    <input type="number" id="sttSampleRate" value="16000" min="8000" max="48000">
                </div>
                
                <div class="button-group">
                    <button class="btn-primary" id="sttTranscribeButton">Transcribe</button>
                    <button class="btn-danger" id="sttDisconnectBtn">Disconnect</button>
                </div>
                
                <div class="output" id="sttOutput"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080';
        
        // ==================== TTS WebSocket ====================
        let ttsSock = null;
        
        function connectTTS() {
            return new Promise((resolve, reject) => {
                ttsSock = new WebSocket('ws://localhost:8080/ws/tts');
                ttsSock.onopen = () => {
                    updateTTSStatus('Connected', 'connected');
                    log('ttsOutput', '✓ TTS WebSocket connected');
                    resolve();
                };
                ttsSock.onerror = (e) => {
                    updateTTSStatus('Error', 'disconnected');
                    log('ttsOutput', '✗ Connection error: ' + e.message, true);
                    reject(e);
                };
                ttsSock.onclose = () => {
                    updateTTSStatus('Disconnected', 'disconnected');
                    log('ttsOutput', '✗ WebSocket closed');
                };
                ttsSock.onmessage = (event) => {
                    const response = JSON.parse(event.data);
                    if (response.error) {
                        log('ttsOutput', '✗ Error: ' + response.error, true);
                    } else {
                        const audioData = Uint8Array.from(atob(response.audio), c => c.charCodeAt(0));
                        const blob = new Blob([audioData], { type: 'audio/wav' });
                        const url = URL.createObjectURL(blob);
                        
                        const audio = document.getElementById('ttsAudio');
                        audio.src = url;
                        audio.style.display = 'block';
                        
                        log('ttsOutput', `✓ Audio synthesized: ${response.duration.toFixed(2)}s`, false);
                    }
                    updateTTSStatus('Ready', 'connected');
                };
            });
        }
        
        function updateTTSStatus(text, className) {
            const el = document.getElementById('ttsStatus');
            el.textContent = text;
            el.className = `status ${className}`;
        }
        
        document.getElementById('ttsSynthButton').addEventListener('click', async () => {
            if (!ttsSock || ttsSock.readyState !== WebSocket.OPEN) {
                try {
                    await connectTTS();
                } catch (e) {
                    return;
                }
            }
            
            updateTTSStatus('Processing...', 'processing');
            
            const text = document.getElementById('ttsText').value;
            const voice = document.getElementById('ttsVoice').value;
            const speed = parseFloat(document.getElementById('ttsSpeed').value);
            
            if (!text) {
                log('ttsOutput', '✗ Please enter text', true);
                return;
            }
            
            const request = {
                text: text,
                voice: voice,
                speed: speed
            };
            
            log('ttsOutput', `→ Sending request: ${JSON.stringify(request)}`);
            ttsSock.send(JSON.stringify(request));
        });
        
        document.getElementById('ttsDisconnectBtn').addEventListener('click', () => {
            if (ttsSock) {
                ttsSock.close();
                ttsSock = null;
            }
        });
        
        // Speed slider display
        document.getElementById('ttsSpeed').addEventListener('input', (e) => {
            document.getElementById('speedValue').textContent = e.target.value;
        });
        
        // ==================== STT WebSocket ====================
        let sttSock = null;
        
        function connectSTT() {
            return new Promise((resolve, reject) => {
                sttSock = new WebSocket('ws://localhost:8080/ws/stt');
                sttSock.onopen = () => {
                    updateSTTStatus('Connected', 'connected');
                    log('sttOutput', '✓ STT WebSocket connected');
                    resolve();
                };
                sttSock.onerror = (e) => {
                    updateSTTStatus('Error', 'disconnected');
                    log('sttOutput', '✗ Connection error: ' + e.message, true);
                    reject(e);
                };
                sttSock.onclose = () => {
                    updateSTTStatus('Disconnected', 'disconnected');
                    log('sttOutput', '✗ WebSocket closed');
                };
                sttSock.onmessage = (event) => {
                    const response = JSON.parse(event.data);
                    if (response.error) {
                        log('sttOutput', '✗ Error: ' + response.error, true);
                    } else {
                        log('sttOutput', `✓ Transcribed: "${response.text}"`, false);
                        log('sttOutput', `  Duration: ${response.duration.toFixed(2)}s | Processing: ${response.processing_time.toFixed(2)}s`);
                    }
                    updateSTTStatus('Ready', 'connected');
                };
            });
        }
        
        function updateSTTStatus(text, className) {
            const el = document.getElementById('sttStatus');
            el.textContent = text;
            el.className = `status ${className}`;
        }
        
        document.getElementById('sttTranscribeButton').addEventListener('click', async () => {
            const file = document.getElementById('sttFile').files[0];
            if (!file) {
                log('sttOutput', '✗ Please select audio file', true);
                return;
            }
            
            if (!sttSock || sttSock.readyState !== WebSocket.OPEN) {
                try {
                    await connectSTT();
                } catch (e) {
                    return;
                }
            }
            
            updateSTTStatus('Processing...', 'processing');
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const arrayBuffer = e.target.result;
                const uint8Array = new Uint8Array(arrayBuffer);
                const base64 = btoa(String.fromCharCode.apply(null, uint8Array));
                
                const sampleRate = parseInt(document.getElementById('sttSampleRate').value);
                const request = {
                    audio: base64,
                    sample_rate: sampleRate
                };
                
                log('sttOutput', `→ Sending audio: ${file.name} (${(file.size / 1024).toFixed(2)} KB)`);
                sttSock.send(JSON.stringify(request));
            };
            
            reader.readAsArrayBuffer(file);
        });
        
        document.getElementById('sttDisconnectBtn').addEventListener('click', () => {
            if (sttSock) {
                sttSock.close();
                sttSock = null;
            }
        });
        
        // ==================== Utilities ====================
        function log(elementId, message, isError = false) {
            const el = document.getElementById(elementId);
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] ${message}`;
            el.textContent += (el.textContent ? '\n' : '') + logEntry;
            el.scrollTop = el.scrollHeight;
            
            if (isError) {
                el.classList.add('error');
                el.classList.remove('success');
            } else if (message.includes('✓')) {
                el.classList.add('success');
                el.classList.remove('error');
            }
        }
        
        // Auto-connect on load
        window.addEventListener('load', () => {
            connectTTS().catch(() => {});
            connectSTT().catch(() => {});
        });
    </script>
</body>
</html>
